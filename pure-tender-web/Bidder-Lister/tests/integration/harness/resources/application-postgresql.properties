# Disposable test database only. Never point this harness at production.
spring.datasource.url=${AUDIT_DATABASE_URL}
spring.datasource.username=${AUDIT_DATABASE_USER}
spring.datasource.password=${AUDIT_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# Needed by the test FabricService subclass's inherited property injection.
fabric.crypto-path=/nonexistent/audit-fabric
fabric.peer-endpoint=localhost:7051
fabric.peer-hostname=peer0.org1.example.com
fabric.channel=mychannel
fabric.chaincode=puretender
audit.fabric-accept=${AUDIT_FABRIC_ACCEPT:false}
